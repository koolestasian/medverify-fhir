[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "medverify-fhir"
version = "0.2.0"
description = "Deterministic verification for medical claims and FHIR prior authorization"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
medverify = "medverify._demo:main"
medverify-ingest = "medverify.ingest:main"

[dependency-groups]
dev = [
    "maturin>=1.10,<2",
    "mypy",
    "pip>=26.3",
    "pre-commit",
    "psutil>=7.2.2",
    "pytest",
    "ruff>=0.17",
    "types-psutil",
]

[tool.maturin]
manifest-path = "crates/medverify-py/Cargo.toml"
python-source = "python"
module-name = "medverify._medverify"
features = ["extension-module"]
# medverify-core compiles both policy tables in with include_str!, so an sdist without them
# cannot build.
include = [{ path = "policy/*.toml", format = "sdist" }]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "policy/*.toml" },
    { file = "python/**/*.py" },
    { file = "python/**/*.pyi" },
    { file = "python/**/py.typed" },
]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
