[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["BSD-3-Clause"], crate = "curve25519-dalek" },
    { allow = ["BSD-3-Clause"], crate = "ed25519-dalek" },
    { allow = ["BSD-3-Clause"], crate = "subtle" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
