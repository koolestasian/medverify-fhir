[package]
name = "medverify-core"
description = "NCCI, WISeR and Da Vinci PAS verification core for MedVerify-FHIR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
csv = "1.4"
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
hmac = { version = "0.13", features = ["zeroize"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "std", "tzdb-bundle-always"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", default-features = false, features = ["macros", "parsing"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zeroize = "1"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.8"

[[bench]]
name = "throughput"
harness = false
